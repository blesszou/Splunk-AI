[ollama]
base_url = http://localhost:11434/v1
model_name = gemma4
# Ollama is unauthenticated on localhost; no credential is needed.
api_key = none

[gemini]
base_url = https://generativelanguage.googleapis.com/v1beta/openai/
model_name = gemini-3.1-flash-lite
# Do NOT put the API key here. Store it in Splunk's encrypted credential store:
#   curl -k -u <admin> \
#     https://localhost:8089/servicesNS/nobody/splunk_ai/storage/passwords \
#     -d realm=splunk_ai -d name=gemini -d password='<YOUR_KEY>'

# ── Case 3: RAG infrastructure ───────────────────────────────────────────────
[milvus]
host = 127.0.0.1
port = 19530

[embedding]
# Embedding model served by Ollama (via /v1/embeddings OpenAI-compatible endpoint)
model = all-minilm
