[airag-command]
syntax = [ | airag prompt="What is Splunk?"  provider=ollama model="llama3:lastest"]
shortdesc = [Query RAG with LLM]
usage = public

[mcpagent-command]
syntax = [ | mcpagent ]
shortdesc = [MCP query splunk data]
usage = public

[llmchat-command]
syntax = [ | llmchat session="xxx" (prompt="analyze the logs" | prompt_b64="<base64-utf8>") (provider=ollama|gemini)? (max_events=<int>)?]
shortdesc = [Chat with LLM over the piped events]
usage = public
comment1 = Use prompt_b64 when building SPL programmatically: it keeps quotes, backslashes and newlines out of the generated query.
example1 = ... | head 50 | llmchat session="s1" prompt="summarize the top errors"

[aiagentx-command]
syntax = [ | aiagentx prompt="<question>" (llm_connection="<aitk_llm_name>")? (provider=gemini|ollama)? (model="<model_name>")? (timeout=<seconds>)? (mcp_connection="<local_mcp|aitk_mcp_name>")?]
shortdesc = [AI Agent using splunklib.ai, AI Toolkit connections, and MCP]
usage = public

